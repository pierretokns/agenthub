model = "PrimeIntellect/Qwen3-1.5B-Instruct"
max_steps = 10000

# Training hyperparameters
batch_size = 512
rollouts_per_example = 8
learning_rate = 2e-5
lora_alpha = 16

[sampling]
max_tokens = 2048
temperature = 0.7

# BRIGHT retrieval training
[[env]]
id = "primeintellect/bright-retrieval"
args = { split = "train" }

# W&B logging (optional - add your W&B key to enable)
# [wandb]
# project = "autoresearch-embed"
# entity = "pierretokns"
# name = "bright-baseline"

# Online evaluation during training
[eval]
interval = 1000
num_examples = -1
rollouts_per_example = 1

[[eval.env]]
id = "primeintellect/bright-retrieval"
args = { split = "test" }

# Checkpointing
[checkpoints]
interval = 1000
keep_cloud = 3

# Infrastructure (L40S free tier)
[infrastructure]
compute_size = "M"
